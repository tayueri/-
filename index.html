<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネット広告 安全操作トレーニング</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 26px;
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: #1769e0;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>ネット広告 安全操作トレーニング</h1>

      <p>
        Webサイトを見ているときに表示される広告や警告画面を、
        安全に判断する練習サイトです。
      </p>

      <p>
        このサイトに表示される警告や広告はすべて練習用です。
      </p>

      <button onclick="alert('動作確認OK！')">
        トレーニングを始める
      </button>
    </div>
  </main>
</body>
</html>
