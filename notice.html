<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>セキュリティに関するお知らせ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="scenario3" class="notice-page">
  <main class="notice-stage">
    <section class="notice-panel" aria-labelledby="noticeTitle">
      <div class="notice-topline">
        <span class="notice-source-dot" aria-hidden="true"></span>
        <span>端末保護センター</span>
      </div>

      <div class="notice-icon" aria-hidden="true">!</div>
      <p class="notice-caption">セキュリティ通知</p>
      <h1 id="noticeTitle">セキュリティ上の問題が<br>検出されました</h1>

      <div class="notice-status" aria-hidden="true">
        <span>保護状態</span>
        <strong>要確認</strong>
      </div>

      <p class="notice-text">
        この端末で確認が必要な項目が見つかりました。
        データを保護するため、今すぐ状態を確認してください。
      </p>

      <button class="scenario3-choice notice-primary" type="button" data-hit="「今すぐ確認」ボタン">
        今すぐ確認
      </button>

      <button class="scenario3-choice notice-secondary" type="button" data-hit="「スキャンを開始」ボタン">
        スキャンを開始
      </button>

      <p class="notice-small">
        この画面を閉じる前に確認することを推奨します。
      </p>
    </section>
  </main>

  <div id="q3NgOverlay" class="overlay feedback-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="q3NgTitle">
    <div class="feedback-card">
      <div class="feedback-symbol ng-symbol">×</div>
      <h2 id="q3NgTitle">NG！</h2>
      <p>警告画面の中にあるボタンを押しました。</p>

      <div class="hit-box">
        <span>あなたが押した場所</span>
        <strong id="q3HitTarget">警告画面のボタン</strong>
      </div>

      <p class="feedback-explanation">
        突然表示された警告では、画面内の指示にすぐ従わず、
        まずその画面から離れる方法を考えてみましょう。
      </p>

      <button id="q3RetryButton" class="secondary-button" type="button">
        もう一度やってみる
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
